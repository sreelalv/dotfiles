

backend = "glx";

# Make inactive windows slightly transparent (e.g., 80% opacity)
inactive-opacity = 0.8;

# Keep active focused windows fully opaque
active-opacity = 0.8;

# Make window titlebars and borders transparent
frame-opacity = 1;

inactive-dim = 0.4 ;

opacity-rule = [
  "100:fullscreen",
  "90:class_g = 'kitty'",
  "90:class_g = 'Alacritty'",
  "100:class_g = 'i3lock'",
  "100:class_g = 'zenity'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'mpv'",
  "100:class_g = 'Virt-manager'"
];

focus-exclude = [
  "class_g = 'Rofi'"
];
